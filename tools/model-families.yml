# Model-family and lifecycle catalog used by the README chart generator.
#
# `released` is the model's recorded API availability date, never a model-ID
# snapshot date or a prompt capture timestamp. `lineage` and
# `lineage_position` explicitly define successor order; parallel tiers such as
# mini, nano, and Pro belong to separate lineages. Update this catalog when
# adding a model to the archive, and cite reviewed availability evidence in
# `sources`. Unknown archive models receive their own chart with no guessed
# release marker.
#
# Lifecycle/source fields were copied from Cadence's reviewed
# scripts/systemprompts/model-era-map.yml. Chart lineage fields are maintained
# here because they describe this archive's presentation.
