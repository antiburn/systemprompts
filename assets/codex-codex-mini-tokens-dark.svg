<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 625" width="1100" height="625" role="img" aria-labelledby="chartTitle chartDesc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="chartTitle">Codex Codex mini native token history</title>
<desc id="chartDesc">System message and built-in tool token counts for the most recently released model in this lineage at each CLI release. System-message counts remain visible when exact native prompt measurement is available; the aggregate tool area breaks when any tool count is unavailable. Dotted markers show model API availability dates.</desc>
<rect x="0" y="0" width="1100" height="625" fill="#1a1a19"/>
<line x1="80" y1="28" x2="104" y2="28" stroke="#3987e5" stroke-width="3" stroke-linecap="round"/>
<text x="112" y="33" font-size="15" fill="#c3c2b7">System message</text>
<line x1="300" y1="28" x2="324" y2="28" stroke="#d95926" stroke-width="3" stroke-linecap="round"/>
<text x="332" y="33" font-size="15" fill="#c3c2b7">Built-in tools (aggregate)</text>
<line x1="80" y1="565.0" x2="1070" y2="565.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="68" y="569.0" font-size="15" fill="#898781" text-anchor="end">0</text>
<line x1="80" y1="70.0" x2="1070" y2="70.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="68" y="74.0" font-size="15" fill="#898781" text-anchor="end">10k</text>
<text x="24" y="317.5" font-size="14" fill="#898781" text-anchor="middle" letter-spacing="1.5" transform="rotate(-90 24 317.5)">TOKENS</text>
<line x1="80" y1="565" x2="1070" y2="565" stroke="#383835" stroke-width="1"/>
<text x="80.0" y="592" font-size="14" fill="#898781" text-anchor="start">Apr 2025</text>
<text x="245.0" y="592" font-size="14" fill="#898781" text-anchor="middle">Jul 2025</text>
<text x="410.0" y="592" font-size="14" fill="#898781" text-anchor="middle">Oct 2025</text>
<text x="575.0" y="592" font-size="14" fill="#898781" text-anchor="middle">Dec 2025</text>
<text x="740.0" y="592" font-size="14" fill="#898781" text-anchor="middle">Mar 2026</text>
<text x="905.0" y="592" font-size="14" fill="#898781" text-anchor="middle">Jun 2026</text>
<text x="1070.0" y="592" font-size="14" fill="#898781" text-anchor="end">Sep 2026</text>
<g data-release-date="2025-05-16"><line x1="137.3" y1="70" x2="137.3" y2="565" stroke="#898781" stroke-width="1" stroke-dasharray="2,5" stroke-linecap="round" opacity="0.7"/>
<text x="137.3" y="61.0" font-size="14" font-weight="600" fill="#c3c2b7" text-anchor="middle">codex-mini</text></g>
<g data-release-date="2025-11-12"><line x1="489.3" y1="70" x2="489.3" y2="565" stroke="#898781" stroke-width="1" stroke-dasharray="2,5" stroke-linecap="round" opacity="0.7"/>
<text x="489.3" y="61.0" font-size="14" font-weight="600" fill="#c3c2b7" text-anchor="middle">gpt-5.1-codex-mini</text></g>
<text x="575.0" y="317.5" font-size="16" fill="#898781" text-anchor="middle">No exact native system-message measurements for the selected model.</text>
</svg>
